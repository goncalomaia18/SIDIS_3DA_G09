
spring.application.name=flight-operations-service

# Instance configuration
server.port=${SERVER_PORT:8080}

# Independent persistent H2 database per instance
spring.datasource.url=jdbc:h2:file:./data/flightdb_${server.port}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Preserve database schema and data between restarts
spring.jpa.hibernate.ddl-auto=update

# Fixed authentication credentials
spring.security.user.name=user
spring.security.user.password=${FLIGHT_OPERATIONS_PASSWORD:123}

# Forwarding configuration
flight.peers=${FLIGHT_PEERS:}

# Credentials for communication between Flight Operations instances
flight.peer.username=user
flight.peer.password=${FLIGHT_OPERATIONS_PASSWORD:123}

# External microservice communication
services.airports-routes.urls=http://localhost:8083,http://localhost:8084
services.airports-routes.username=user
services.airports-routes.password=${AIRPORTS_ROUTES_PASSWORD:123}

services.aircraft-maintenance.urls=http://localhost:8081,http://localhost:8085
services.aircraft-maintenance.username=user
services.aircraft-maintenance.password=${AIRCRAFT_MAINTENANCE_PASSWORD:123}

# RabbitMQ
spring.rabbitmq.host=192.168.1.151
spring.rabbitmq.port=5672
spring.rabbitmq.username=sidis
spring.rabbitmq.password=1234567890

# Unique RabbitMQ queues for each Flight Operations instance
sidis.rabbitmq.aircraft.queue=flight.aircraft.${server.port}
sidis.rabbitmq.route.queue=flight.routes.${server.port}
