
spring.application.name=flight-operations-service

# Instance configuration
server.port=${SERVER_PORT:8080}

# Independent H2 database per instance
spring.datasource.url=jdbc:h2:mem:flightdb_${SERVER_PORT:8080}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

# REST communication with Airports & Routes
services.airports-routes.url=http://localhost:8083
services.airports-routes.username=user
services.airports-routes.password=${AIRPORTS_ROUTES_PASSWORD}

# REST communication with Aircraft & Maintenance
services.aircraft-maintenance.url=http://localhost:8081
services.aircraft-maintenance.username=user
services.aircraft-maintenance.password=${AIRCRAFT_MAINTENANCE_PASSWORD}

# Forwarding configuration (next step)
flight.peers=${FLIGHT_PEERS:}

# Credentials used for communication between Flight Operations instances
spring.security.user.password=${FLIGHT_OPERATIONS_PASSWORD}

flight.peer.username=user
flight.peer.password=${FLIGHT_OPERATIONS_PASSWORD}
