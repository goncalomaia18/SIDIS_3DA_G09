
spring.application.name=airports-routes-service

# Instance configuration
server.port=${SERVER_PORT:8083}

# Fixed authentication credentials
spring.security.user.name=user
spring.security.user.password=${AIRPORTS_ROUTES_PASSWORD:123}

# Forwarding configuration (to implement later)
airports.routes.peers=${AIRPORTS_ROUTES_PEERS:}


# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Independent RabbitMQ queue per instance
sidis.rabbitmq.aircraft.queue=airports.aircraft.${server.port}
