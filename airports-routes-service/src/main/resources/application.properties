spring.application.name=airports-routes-service

# Instance configuration
server.port=${SERVER_PORT:8083}

# Fixed authentication credentials
spring.security.user.name=user
spring.security.user.password=${AIRPORTS_ROUTES_PASSWORD:123}

# Forwarding configuration
airports.routes.peers=${AIRPORTS_ROUTES_PEERS:}

# Database H2 isolada dinamicamente por porta
spring.datasource.url=jdbc:h2:mem:airports_db_${server.port};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console & JPA Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Independent RabbitMQ queue per instance
sidis.rabbitmq.aircraft.queue=airports.aircraft.${server.port}
