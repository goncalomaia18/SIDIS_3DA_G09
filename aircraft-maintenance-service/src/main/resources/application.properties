spring.application.name=aircraft-maintenance-service

# Instance configuration
server.port=${SERVER_PORT:8081}

# Independent persistent H2 database per instance
spring.datasource.url=jdbc:h2:file:./data/aircraftdb_${server.port}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Authentication
spring.security.user.name=user
spring.security.user.password=${AIRCRAFT_MAINTENANCE_PASSWORD:123}

# Forwarding configuration
aircraft.maintenance.peers=${AIRCRAFT_MAINTENANCE_PEERS:}

# RabbitMQ
spring.rabbitmq.host=100.117.180.20
spring.rabbitmq.port=5672
spring.rabbitmq.username=sidis
spring.rabbitmq.password=1234567890

# Publisher confirmation
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

# Unique RabbitMQ queues for each Aircraft Maintenance instance
sidis.rabbitmq.aircraft.queue=aircraft.events.${server.port}
sidis.rabbitmq.aircraft.status.queue=aircraft.status.${server.port}
sidis.rabbitmq.maintenance.queue=maintenance.record.${server.port}
sidis.rabbitmq.maintenance.completed.queue=maintenance.completed.${server.port}